
services:
  # 1. Redis – spravovaná instance Render
  - type: keyvalue
    name: erpnext-redis
    region: frankfurt
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow connections

  # 2. Webová aplikace ERPNext
  - type: web
    name: erpnext-web
    runtime: docker
    region: frankfurt
    dockerContext: .
    dockerfilePath: images/production/Containerfile
    plan: free
    envVars:
      - key: REDIS_CACHE
        fromService:
          name: erpnext-redis
          type: keyvalue
          property: connectionString

      - key: DB_TYPE
        value: mariadb
