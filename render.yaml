databases:
  - name: erpnext-db
    databaseName: erpnext
    user: erpnext_user
    plan: free

services:
  # 1. Opravená konfigurace pro Redis z Docker Hubu
  - type: web
    name: erpnext-redis
    env: image
    image:
      repo: redis
      tag: 7-alpine
    plan: free

  # 2. Webová aplikace ERPNext
  - type: web
    name: erpnext-web
    env: docker
    repo: https://github.com
    dockerContext: .
    dockerfilePath: images/production/Containerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: erpnext-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: erpnext-db
          property: port
      - key: DB_TYPE
        value: postgres
      - key: REDIS_CACHE
        fromService:
          name: erpnext-redis
          property: host
